[project]
name = "ReapySet"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cookiecutter>=2.7.1",
    "loguru>=0.7.3",
    "platformdirs>=4.11.2",
    "pyqtdarktheme>=2.1.0",
    "pyside6>=6.11.0",
    "tomlkit>=0.15.0",
]

[dependency-groups]
dev = [
    "imageio>=2.37.4",
    "mypy>=2.3.0",
    "nuitka>=4.1.3",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

