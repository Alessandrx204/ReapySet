<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Starter Template</title>
    <!-- PyScript Core CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .container {
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2563eb;
            margin-top: 0;
        }
        .output-box {
            background-color: #f1f5f9;
            border-left: 4px solid #2563eb;
            padding: 16px;
            margin-top: 20px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PyScript Minimal Boilerplate</h1>
        <p>This page runs Python directly in your browser using WebAssembly.</p>
        
        <div class="output-box">
            <!-- Link to configuration and main Python file -->
            <script type="py" config="./pyscript.json" src="./main.py"></script>
        </div>
    </div>
<h6 class="footer-note">Generated by ReapySet</h6>
</body>
</html>
