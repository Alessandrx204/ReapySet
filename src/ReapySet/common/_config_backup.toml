[advanced] # Avoid if you don't want to mess up with the Application
nativeMenubar = true # only macOS and some Linux DEs
main_window_height = 380 # on some linux distros or older windows versions or
# if you enable force_attached_menubar on macOS and gnome the window will get a bit clunky,
# i reccoment tweaking this value if you mess up with the menu bar or if your oprating system is very customised or not well detected by ReapySet
install_packages_on_project_creation = true # if you want to install the packages on project creation, set this to true.
# If you want to install them manually, set it to false. This is useful if you want to create a project without internet connection
# or if you want to install the packages later.:p